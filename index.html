function home(){view='home';document.body.dataset.view='home';selected=null;const has=state.started&&!state.finished;const label=state.finished?'ดูบันทึกการเดินทาง':has?'กลับไปหาทางออกกัน':'เข้าเขาวงกตกันเลย';app.innerHTML=`<section class="home"><div class="home-grid"><div class="home-copy"><div class="eyebrow">A tiny adventure, just for you</div><h1>หลงทางนิดหน่อย<br><span>หลงเธอเต็มใจ</span></h1><span class="pill">${icon('lock')} เขาวงกตนี้... ใช้ความรู้ใจเปิดประตู</span><p class="lead">แย่แล้ว! เธอติดอยู่ในเขาวงกตของเค้า<br>มีประตูหัวใจ 10 บานรออยู่ ตอบให้ถูกทีละข้อ<br>แล้วพาเราสองคนออกไปด้วยกันนะ ♡</p><div class="home-actions"><button class="primary wide start">${label}${icon('arrow')}</button><p style="font-size:11px;color:var(--muted);margin-top:12px;text-align:center">${has?`เก็บไว้ให้แล้ว · อยู่ที่ประตู ${state.index+1} จาก 10`:'ไม่จับเวลา · ลองใหม่ได้ · งอนแต่ไม่ทิ้งกัน'}</p></div></div><div class="hero-art">${heroArt()}<p class="art-note">TEN LITTLE GATES. ONE BIG HEART.</p></div><div class="home-actions mobile-actions" style="display:none"><button class="primary wide start">${label}${icon('arrow')}</button><p style="font-size:10px;color:var(--muted);margin-top:11px;text-align:center">${has?`เก็บไว้ให้แล้ว · อยู่ที่ประตู ${state.index+1} จาก 10`:'ไม่จับเวลา · ลองใหม่ได้ · งอนแต่ไม่ทิ้งกัน'}</p></div></div><div class="rules"><div class="rule"><div class="rule-number">01</div><div><strong>ตอบถูก เปิดประตู</strong><p>ตอบผิดยังไปต่อไม่ได้<br>ลองใหม่จนถูกได้เลย</p></div></div><div class="rule"><div class="rule-number">02</div><div><strong>ครั้งแรกมีความหมาย</strong><p>ถูกครั้งแรกได้ 1 คะแนน<br>คะแนนเต็ม 10 หัวใจ</p></div></div><div class="rule"><div class="rule-number">03</div><div><strong>ตอนจบของเรา</strong><p>ผ่านครบจึงได้ออกไป<br>มี 4 ตอนจบตามคะแนน</p></div></div></div></section>`;document.querySelectorAll('.start').forEach(b=>b.onclick=()=>{if(state.finished)result();else{state.started=true;save();game();}window.scrollTo(0,0)})}
function stops(){return `<div class="map-strip"><div class="map-heading"><span>เส้นทางออกจากเขาวงกต</span><small>${state.cleared.filter(Boolean).length} / 10 ประตูเปิดแล้ว</small></div><div class="stops" aria-label="ความคืบหน้า">${questions.map((q,i)=>`<span class="stop ${state.cleared[i]?'passed':i===state.index?'current':''}" aria-label="ประตู ${i+1} ${state.cleared[i]?'ผ่านแล้ว':i===state.index?'อยู่ตรงนี้':'ล็อกอยู่'}">${state.cleared[i]?'✓':String(i+1).padStart(2,'0')}</span>`).join('')}</div></div>`}
function game(){view='game';document.body.dataset.view='game';selected=null;const i=state.index,q=questions[i],done=state.cleared[i],wrong=state.rejected[i].length>0;app.innerHTML=`<section class="game"><div class="game-top"><div class="eyebrow">Chapter ${String(i+1).padStart(2,'0')} / 10</div><span class="mini-score">♡ ถูกครั้งแรก ${score()} / 10</span></div><div class="game-grid"><div class="world-column"><div class="world-card" style="--scene-bg:${q.color}"><div class="world-head"><span>${q.en}</span><b>${done?'เปิดประตูแล้ว':'ยังติดอยู่ในเขาวงกต'}</b></div><div class="art" id="sceneArt">${art(i)}</div><div class="world-caption"><span>${q.place}</span><span>${done?'กุญแจหัวใจ +1':'ตามหากุญแจหัวใจ ♡'}</span></div></div><div class="speech" id="speech"><div class="avatar">${wrap(bunny(200,150,2.25))}</div><div><small>มิมิ · ผู้เฝ้าเขาวงกต</small><p id="speechText">${done?'ตอบถูกแล้ว! หายงอนแล้วก็ได้ มาจับมือไปต่อกัน ♡':q.story}</p></div></div></div><div class="question-panel"><div class="chapter">ประตูที่ ${String(i+1).padStart(2,'0')} · ${q.place}</div><h2 id="questionTitle" tabindex="-1">${esc(q.q)}</h2><p class="question-hint">เลือกคำตอบในใจ แล้วลองไขประตูดูนะ</p><div class="answers" role="group" aria-labelledby="questionTitle">${q.a.map((a,j)=>`<button class="answer ${state.rejected[i].includes(j)?'rejected':''}" data-choice="${j}" aria-pressed="false" ${done||state.rejected[i].includes(j)?'disabled':''}><span class="answer-letter">${['A','B','C','D'][j]}</span><span class="answer-label">${esc(a)}</span><span class="answer-status" aria-hidden="true">${state.rejected[i].includes(j)?'×':''}</span></button>`).join('')}</div><div class="answer-dock"><button id="submit" class="primary wide submit" ${done?'':'disabled'}>${done?(i===9?'เปิดทางออก ดูคะแนนของเรา':'ไปประตูถัดไป'):'เลือกคำตอบเพื่อไขประตู'}${icon(done?'arrow':'key')}</button><p class="feedback ${done?'success':''}" id="feedback" role="status" aria-live="polite">${done?'ประตูเปิดแล้ว! พร้อมเดินทางต่อได้เลย':wrong?'เค้ายังรออยู่ตรงนี้ ลองคำตอบที่เหลืออีกทีนะ':'ตอบผิดก็ไม่เป็นไร... แต่เค้างอนนะ'}</p></div></div></div>${stops()}</section>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice));$('#submit').onclick=done?next:submit;}
function choose(j){if(state.cleared[state.index]||state.rejected[state.index].includes(j))return;selected=j;document.querySelectorAll('[data-choice]').forEach(b=>{b.classList.toggle('selected',+b.dataset.choice===j);b.classList.remove('wrong');b.setAttribute('aria-pressed',String(+b.dataset.choice===j))});$('#submit').disabled=false;$('#submit').innerHTML='ใช้คำตอบนี้ไขประตู'+icon('key');$('#feedback').textContent='พร้อมแล้ว กดไขประตูได้เลย';$('#feedback').className='feedback'}
function submit(){if(selected===null||state.cleared[state.index])return;const i=state.index,q=questions[i],j=selected;state.attempts[i]++;const good=q.ok.includes(j);tone(good);if(good){state.cleared[i]=true;save();game();const b=$(`[data-choice="${j}"]`);b.classList.add('correct');b.querySelector('.answer-status').textContent='✓';$('#feedback').textContent=state.attempts[i]===1?'ถูกตั้งแต่ครั้งแรก! ได้ 1 คะแนนหัวใจ ♡':'ถูกแล้ว! เปิดประตูได้ ข้อนี้ไม่ได้คะแนนครั้งแรกนะ';$('#speechText').textContent=i===9?'เย้! ประตูทุกบานเปิดแล้ว สุดหล่อรออยู่ข้างนอก ไปดูตอนจบของเรากัน ♡':'ตอบถูกแล้ว! ยอมให้ผ่านก็ได้... จับมือเค้าไว้ด้วยนะ ♡';confetti(15);$('#submit').focus({preventScroll:true})}else{state.rejected[i].push(j);save();const b=$(`[data-choice="${j}"]`);b.classList.remove('selected');b.classList.add('wrong','shake');b.querySelector('.answer-status').textContent='×';b.disabled=true;b.setAttribute('aria-pressed','false');selected=null;$('#submit').disabled=true;$('#submit').innerHTML='ประตูยังล็อกอยู่ ลองเลือกใหม่'+icon('lock');$('#sceneArt').innerHTML=art(i,true);$('#speech').classList.add('angry');$('#speech .avatar').innerHTML=wrap(bunny(200,150,2.25,true));$('#speechText').textContent=q.sulk;$('#feedback').className='feedback error';$('#feedback').textContent=q.sulk;}}
function next(){if(!state.cleared[state.index])return;if(state.index===9){state.finished=true;save();result();confetti(45)}else{state.index++;save();game()}window.scrollTo({top:0,behavior:'instant'})}
function confetti(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const div=document.createElement('div');div.className='confetti';div.setAttribute('aria-hidden','true');div.innerHTML=Array.from({length:n},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#d893a4','#abc18d','#e7cd8b','#b5a2cb'][i%4]};animation-delay:${Math.random()*.4}s;animation-duration:${2+Math.random()}s"></i>`).join('');document.body.append(div);setTimeout(()=>div.remove(),3600)}
const endings=[{min:10,label:'PERFECT HEART · 10/10',title:'รู้ใจจนเขาวงกตยอมแพ้!',text:'ไม่มีหลงเลยสักประตู... เธอจำเรื่องของเค้าได้หมดเลยนี่นา มารับมงกุฎคนรู้ใจ แล้วจับมือออกไปด้วยกันนะ ♡',color:'#f7e4ec',rank:3},{min:8,label:'SWEETHEART · 8–9/10',title:'คนโปรดของเขาวงกต',text:'หลงไปนิดเดียวเอง แต่สุดท้ายก็หาเค้าเจอ ให้ช่อดอกไม้เป็นรางวัล แล้วเรื่องที่ลืม... ไว้มาเติมความรู้ใจกันนะ ♡',color:'#e8efdc',rank:2},{min:5,label:'LITTLE EXPLORER · 5–7/10',title:'หลงบ้าง แต่ยังจับมือกัน',text:'แอบงอนอยู่หลายประตูเลยนะ แต่เธอก็ไม่ยอมแพ้ ยอมออกไปด้วยก็ได้ มีขนมปลอบใจด้วย... แบ่งเค้าครึ่งนึงนะ!',color:'#faedd7',rank:1},{min:0,label:'STILL MY FAVORITE · 0–4/10',title:'งอนอยู่... แต่ก็รอเธอนะ',text:'โอ๊ยย หลงตั้งหลายรอบ! ต้องมาเรียนรู้ใจเค้าเพิ่มแล้วนะ แต่เธอตอบถูกครบและพาเราออกมาได้ เค้าเลยยอมจับมือด้วยอยู่ดี ♡',color:'#eae5f3',rank:0}];
function endingArt(rank){let gift=rank===3?`<path d="m163 59-7-31 25 15 19-27 19 27 25-15-7 31Z" fill="#e2bf6c" stroke="#c3a157" stroke-width="2"/>${heart(200,47,.5,'#cf8897')}${star(82,75,.9)}${star(317,76,.9)}`:rank===2?`${flower(203,102,1.2)}${flower(180,119,.85,'#fff0c7')}${flower(224,119,.85,'#d0b1cf')}<path d="m178 138 23 49 25-49Z" fill="#d7bf9c"/>`:rank===1?`<path d="M164 119h73v51h-73Z" fill="#d2ae88"/><path d="m164 117 37-17 36 17" fill="#e7c99d"/><path d="M166 137h69" stroke="#b8896b" stroke-width="3"/>${heart(201,144,.8,'#fff2d9')}`:`<g class="float"><path d="M169 88q-13-19 8-26 3-29 31-17 24-2 26 21 19 16-1 24Z" fill="#c1b6d5"/><path d="m180 105-4 11m24-7-3 11m22-15-4 11" stroke="#a797bd" stroke-width="3" stroke-linecap="round"/></g>`;return wrap(`<circle cx="200" cy="138" r="100" fill="${endings[3-rank].color}"/><ellipse cx="200" cy="233" rx="131" ry="17" fill="#b4a88822"/>${bunny(126,189,.96,rank===0)}${pig(277,205,.99)}${gift}${heart(321,154,.6)}${flower(62,216,.65)}${flower(334,222,.65,'#f0dca4')}<path d="M154 212q41 22 82 0" stroke="#c59a8c" stroke-width="3" stroke-linecap="round"/>`)}
function result(){if(!state.finished||!state.cleared.every(Boolean)){game();return}view='result';document.body.dataset.view='result';const n=score(),ending=endings.find(e=>n>=e.min);app.innerHTML=`<section class="result"><p class="result-top">THE WAY OUT WAS ALWAYS YOU</p><div class="result-card"><span class="pill">${icon('key')} ออกจากเขาวงกตสำเร็จแล้ว</span><div class="result-art">${endingArt(ending.rank)}</div><p class="chapter">${ending.label}</p><h1>${ending.title}</h1><p class="result-description">${ending.text}</p><div class="score">${n}<small> / 10</small></div><p class="score-label">คะแนนความรู้ใจ · นับเฉพาะคำตอบถูกครั้งแรก</p><div class="stats"><div><b>10 / 10</b><span>ประตูที่เปิดสำเร็จ</span></div><div><b>${mistakes()} ครั้ง</b><span>จำนวนครั้งที่ทำเค้างอน</span></div></div><div class="result-actions"><button class="primary" id="shareResult">เก็บการ์ดคะแนน ♡</button><button class="secondary" id="restart">ลองรู้ใจใหม่อีกครั้ง</button></div><p style="font-size:10px;color:var(--muted);margin-top:13px">เล่นใหม่เพื่อเก็บหัวใจให้ครบ 10 ดวงได้นะ</p></div><details class="review"><summary>เปิดสมุดความรู้ใจ · ดูเฉลยทั้ง 10 ข้อ</summary>${questions.map((q,i)=>`<div class="review-item"><strong>${i+1}. ${esc(q.q)}</strong><p>คำตอบ: ${esc(q.ok.length===4?`${q.a[0]} (ถูกทุกตัวเลือก)`:q.a[q.ok[0]])}</p><span class="badge ${state.attempts[i]===1?'':'missed'}">${state.attempts[i]===1?'♡ ถูกครั้งแรก +1 คะแนน':`ลอง ${state.attempts[i]} ครั้ง · +0 คะแนน`}</span></div>`).join('')}</details></section>`;$('#restart').onclick=resetDialog;$('#shareResult').onclick=downloadCard;}
function showModal(html){modal.innerHTML=html;modal.showModal();modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>modal.close())}
function resetDialog(){showModal(`<h2>เริ่มผจญภัยใหม่ไหม?</h2><p>คะแนนและความคืบหน้ารอบนี้จะเริ่มใหม่ทั้งหมด ถ้าอยากเก็บคะแนนเดิมไว้ ดาวน์โหลดการ์ดก่อนนะ</p><div class="dialog-actions"><button class="secondary" data-close>เก็บรอบนี้ไว้</button><button class="primary" id="confirmReset">เริ่มใหม่เลย ♡</button></div>`);$('#confirmReset').onclick=()=>{const sound=state.sound;state={index:0,attempts:Array(10).fill(0),cleared:Array(10).fill(false),rejected:Array.from({length:10},()=>[]),started:true,finished:false,sound};selected=null;save();modal.close();game();window.scrollTo(0,0)}}
async function downloadCard(){const button=$('#shareResult');button.disabled=true;button.textContent='กำลังทำการ์ดให้...';try{await document.fonts.ready;const n=score(),ending=endings.find(e=>n>=e.min);const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;const c=canvas.getContext('2d');c.fillStyle='#faf5ec';c.fillRect(0,0,1080,1440);c.fillStyle='#fffdf8';c.beginPath();c.roundRect(58,58,964,1324,50);c.fill();c.strokeStyle='#e7ddd0';c.lineWidth=2;c.stroke();c.textAlign='center';c.fillStyle='#8c7869';c.font='20px Mali, Tahoma, sans-serif';c.fillText('A LITTLE LOVE MAZE',540,132);c.font='bold 42px Mali, Tahoma, sans-serif';c.fillStyle='#514940';c.fillText('หลงในใจ',540,200);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(endingArt(ending.rank))});c.drawImage(img,190,205,700,490);c.fillStyle='#a94662';c.font='bold 43px Mali, Tahoma, sans-serif';c.fillText(ending.title,540,755,860);c.font='150px Georgia, serif';c.fillText(`${n} / 10`,540,953);c.fillStyle='#817467';c.font='25px Mali, Tahoma, sans-serif';c.fillText('คะแนนความรู้ใจ · ตอบถูกครั้งแรก',540,1018);c.fillStyle='#617c54';c.font='bold 32px Mali, Tahoma, sans-serif';c.fillText('เปิดครบ 10 ประตู · ออกจากเขาวงกตแล้ว!',540,1120);c.font='26px Mali, Tahoma, sans-serif';c.fillStyle='#8c7869';c.fillText(`ทำเค้างอน ${mistakes()} ครั้ง แต่ก็ยังจับมือกัน ♡`,540,1180);c.font='20px Georgia, serif';c.fillText('TEN LITTLE GATES. ONE BIG HEART.',540,1310);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)throw Error('png');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`love-maze-${n}-of-10.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('สร้างการ์ดคะแนนแล้ว ♡ หากเปิดเป็นรูป ให้กดค้างเพื่อบันทึก')}catch(e){toast('ยังบันทึกรูปไม่ได้ ลองจับภาพหน้าจอเก็บคะแนนไว้ก่อนได้นะ')}finally{button.disabled=false;button.textContent='เก็บการ์ดคะแนน ♡'}}
$('#logo').innerHTML=icon('heart');$('#mapBtn').innerHTML=icon('map');$('#helpBtn').innerHTML=icon('help');function soundUI(){$('#soundBtn').innerHTML=icon(state.sound?'sound':'mute');$('#soundBtn').setAttribute('aria-pressed',String(state.sound));$('#soundBtn').setAttribute('aria-label',state.sound?'ปิดเสียง':'เปิดเสียง')}soundUI();$('#soundBtn').onclick=()=>{state.sound=!state.sound;save();soundUI();if(state.sound)tone();toast(state.sound?'เปิดเสียงกุญแจหัวใจแล้ว ♡':'ปิดเสียงแล้ว เล่นเงียบ ๆ ก็รู้ใจได้')};$('#homeBtn').onclick=()=>{home();window.scrollTo(0,0)};
$('#helpBtn').onclick=()=>showModal(`<h2>ติดอยู่ในเขาวงกตแล้วสิ!</h2><p>มิมิซ่อนทางออกไว้หลังประตู 10 บาน แต่ละบานมีคำถามจากเจ้าของหัวใจรออยู่ เลือกคำตอบ แล้วกดไขประตูนะ</p><p><strong>ตอบถูก:</strong> เปิดประตูและไปต่อได้<br><strong>ตอบผิด:</strong> เค้าจะงอนและประตูยังล็อก ลองตัวเลือกที่เหลือจนถูกได้ ไม่มีจำกัดเวลา</p><p><strong>คะแนน:</strong> ถูกครั้งแรกได้ข้อละ 1 คะแนน ถ้าลองใหม่จะเปิดประตูได้ แต่ไม่ได้คะแนนข้อนั้น คะแนนเต็ม 10</p><p>ต้องเปิดครบทุกประตูจึงออกได้ มีตอนจบ 4 แบบ: 10, 8–9, 5–7 และ 0–4 คะแนน</p><p>ความคืบหน้าบันทึกในเบราว์เซอร์นี้อัตโนมัติเมื่อรองรับ เปิดไฟล์เดิมในเบราว์เซอร์เดิมเพื่อเล่นต่อได้ ไม่มีการส่งคำตอบออกไปที่ไหน</p><button class="primary wide" data-close>เข้าใจแล้ว จับมือไว้เลย ♡</button>`);
$('#mapBtn').onclick=()=>showModal(`<h2>แผนที่หัวใจ</h2><p>ตอนนี้${state.finished?'ออกจากเขาวงกตแล้ว':state.started?`อยู่ที่ประตู ${state.index+1} ยังต้องหาทางออกต่อ`:'อยู่ตรงทางเข้า การเดินทางยังไม่เริ่ม'} · เปิดแล้ว ${state.cleared.filter(Boolean).length}/10 ประตู</p><div class="modal-map">${questions.map((q,i)=>`<div class="map-tile ${state.cleared[i]?'done':state.started&&i===state.index?'active':''}">${String(i+1).padStart(2,'0')} · ${q.place}<small>${state.cleared[i]?'✓ เปิดประตูแล้ว':state.started&&i===state.index?'♡ เธออยู่ตรงนี้':'ล็อกอยู่'}</small></div>`).join('')}</div><p>ตอบให้ถูกทีละข้อเพื่อเปิดเส้นทาง ไม่มีทางลัดนะ ♡</p><button class="primary wide" data-close>เก็บแผนที่ แล้วไปกันต่อ</button>`);
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
home();
</script>
</body>
